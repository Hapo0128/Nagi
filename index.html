.diary-export{width:100%;display:flex;align-items:center;gap:13px;text-align:left;padding:16px 18px;margin:0 0 20px;border:1px solid #cbdfe6;border-radius:19px;background:linear-gradient(110deg,#dfedf3,#edf5f6 65%,#fbf4e7);box-shadow:0 7px 25px #48677408;min-height:80px}
.diary-export> .icon:first-child{width:28px;height:28px;flex:none;color:var(--blue)}
.diary-export> .icon:last-child{margin-left:auto;width:20px;flex:none;color:var(--blue)}
.diary-export strong{font-size:15px;font-weight:600;display:block;line-height:1.6}
.diary-export small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6}
.diary-dialog{padding:0;width:calc(100% - 24px);max-width:520px;max-height:92svh;border-radius:24px;overflow:auto;overscroll-behavior:contain}
.diary-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 19px 12px;position:sticky;top:0;background:#fbfdfe;z-index:1;border-bottom:1px solid var(--line)}
.diary-dialog-head h2{font-size:18px;line-height:1.5}
.diary-dialog-head .icon-button{min-width:44px;min-height:44px;padding:10px}
.diary-dialog-body{padding:15px 18px 5px}
.diary-preview-link{display:block;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#e5eff2;line-height:0;-webkit-touch-callout:default}
.diary-preview-link img{display:block;object-fit:contain;width:100%;height:auto;max-height:52svh;-webkit-touch-callout:default;user-select:auto}
.diary-dialog .diary-caption{font-size:11px;line-height:1.7;text-align:center;margin:9px 0;color:var(--muted)}
.diary-dialog .diary-help{font-size:11px;line-height:1.8;margin:10px 0 12px;white-space:normal}
.diary-dialog .diary-small-text{font-size:11px;color:#836536;background:#fbf4e7;padding:9px 11px;border-radius:10px;margin:10px 0;white-space:normal}
.diary-dialog-foot{position:sticky;bottom:0;background:#fbfdfe;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.diary-dialog-foot .primary{width:100%;min-height:49px}
.diary-fallback{display:flex;justify-content:center;margin-top:9px;font-size:11px;line-height:1.8}
@media(max-width:370px){.diary-export{padding:13px 14px;gap:10px}.diary-export strong{font-size:13px}.diary-export small{font-size:10px}.diary-dialog-head h2{font-size:16px}}
@media print{.diary-export,.diary-dialog{display:none!important}}


/* v4: explicit decision controls and a non-blocking draft reminder. */
.check-top-actions{display:flex;align-items:center;gap:12px;min-width:0}
.cancel-check{min-height:44px;min-width:66px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:#ffffffaa;color:var(--muted);font-size:12px;white-space:nowrap}
.cancel-check:hover{background:white}
.restore-banner{background:#f4f8f9;border-color:#d9e6e9;align-items:center}
.restore-banner strong{font-weight:550}
.restore-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.restore-actions button{min-height:44px;padding:6px 0}
.restore-actions button[data-action="discard-check"]{font-weight:400;color:var(--muted)}
.check-controls-top{max-width:610px;margin:0 auto 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;min-height:28px}
.check-controls-top .skip-link{font-size:12px;color:var(--blue-dark);padding:5px 10px;min-height:38px;white-space:nowrap;border-radius:10px}
.check-controls-top .skip-link:hover{background:#fff}
.bottom-inner.check-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.check-actions .primary,.check-actions .secondary{min-width:0;min-height:52px;padding:12px 10px;white-space:nowrap;gap:7px;font-size:14px}
.check-actions .primary{font-weight:650}
.check-actions .save-finish{border-color:#bed3da;background:#fff}
.check-page{padding-bottom:175px}
.mood-slider{padding:0;height:52px;border:0;border-radius:0;margin:8px 0 0;touch-action:pan-y}
.mood-slider:focus-visible{outline:3px solid #5c94ac;outline-offset:4px}
.mood-slider-shell{margin-top:12px}
.custom-sleep input{flex:0 0 94px}
@media(max-width:700px){.check-page{padding-bottom:170px}.check-top{gap:6px}.check-top-actions{gap:8px}.check-top .back{font-size:12px}.check-mode{gap:5px;font-size:11px}.cancel-check{font-size:11px;min-width:60px;padding:6px 8px}.check-controls-top{font-size:10px;margin-bottom:5px}.check-actions .primary,.check-actions .secondary{font-size:13px}.bottom-inner.check-actions{gap:9px}.restore-actions{gap:12px}.mood-slider-shell{padding:17px 15px 15px}}
@media(max-width:365px){.check-top-actions{gap:5px}.check-mode .icon{width:17px;height:17px}.check-mode{font-size:10px}.cancel-check{min-width:54px;font-size:10px;padding:5px 6px}.check-top .back{font-size:11px}.check-actions .primary,.check-actions .secondary{font-size:12px;padding:11px 7px;gap:4px}.check-actions .icon{width:18px;height:18px}.restore-actions{gap:10px}.restore-banner{padding:10px 11px}.restore-banner button{font-size:10px}}


/* v5: text stays within each card; attached memos are a read-only grouped view. */
.history-layout>*{min-width:0}
.record-list,.history-list-wrap,.home-aside,.row-body{min-width:0;max-width:100%}
.record-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:start;gap:12px;max-width:100%}
.row-body{display:block;overflow:hidden}
.row-title{min-width:0;column-gap:7px;row-gap:2px;line-height:1.7}
.row-title-text{min-width:0;overflow-wrap:anywhere}
.row-time{white-space:nowrap;flex-shrink:0}
.row-snippet{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;white-space:normal;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere;word-break:normal;max-width:100%;margin-top:5px}
.row-value{white-space:nowrap;min-width:36px;line-height:1.7;align-self:start;justify-self:end}
.record-row>.icon{width:20px;height:20px;margin-top:8px}
.row-quick-notes{display:block;min-width:0;margin-top:9px;border-top:1px solid #e1ebee;padding-top:7px}
.row-quick-note{display:block;min-width:0}
.row-quick-note+.row-quick-note{margin-top:8px}
.row-quick-meta{display:block;font-size:10px;line-height:1.7;color:#557b80;font-weight:550;white-space:normal;overflow-wrap:anywhere}
.row-quick-note .row-snippet{margin-top:1px}
.row-more-memos{display:block;margin-top:6px;font-size:10px;line-height:1.8;color:var(--blue-dark)}
.history-group-hint{font-size:10px;line-height:1.9;color:var(--muted);margin:0 0 12px}
.attached-memo-list{min-width:0;margin-top:21px;padding-top:18px;border-top:1px solid var(--line)}
.attached-memo-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.attached-memo-heading h3{font-size:12px;color:var(--muted);font-weight:550}
.attached-memo{padding:14px 15px;background:#f3f8f8;border:1px solid #e1ecec;border-radius:15px;min-width:0}
.attached-memo+.attached-memo{margin-top:11px}
.attached-memo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.attached-memo-time{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:#54767a}
.attached-memo-time .icon{width:15px;height:15px}
.attached-memo .note-content{font-size:13px;line-height:1.95;min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:normal}
.attached-memo-tools{display:flex;align-items:center;gap:6px;flex-shrink:0}
.attached-memo-tools button{min-height:36px;min-width:36px;padding:6px;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.attached-memo-tools button:hover{background:#e5eef0}
.attached-memo-tools .icon{width:16px;height:16px}
.memo-destination{display:flex;align-items:flex-start;gap:8px;padding:12px 13px;background:#edf5f6;border-radius:13px;border:1px solid #d9e8eb;margin-top:16px;font-size:11px;line-height:1.85;color:var(--muted)}
.memo-destination>.icon{width:18px;height:18px;margin-top:2px;flex:none}
.memo-destination>span{min-width:0;overflow-wrap:anywhere}
.summary-grid,.stat-tile,.stat-name{min-width:0}
.stat-name{overflow-wrap:anywhere}
.stat-name .icon{flex:none}
.diary-export>span{min-width:0;overflow-wrap:anywhere}
@media(max-width:370px){.record-row{grid-template-columns:34px minmax(0,1fr) auto;gap:9px;padding:13px 12px}.row-icon{width:34px;height:34px;border-radius:11px}.row-value{font-size:19px;min-width:30px}.row-title{font-size:11px}.attached-memo{padding:12px}.attached-memo-tools{gap:2px}}

</style>

async function cancelCheck(){

function syncCheckControls(){

function validAnswer(key,value){

 const n=Number(value);return Number.isFinite(n)&&n>=(f.min??1)&&n<=(f.max??10)&&(key==='sleep'?Number.isInteger(n*2):Number.isInteger(n));
}
function choose(value){
 if(!draft||currentView!=='check')return false;

}

function diaryWrap(ctx,text,maxWidth){

 const lines=[];
 // Preserve text, manual line breaks and blank lines, including emoji clusters.
 for(const paragraph of String(text).replace(/\r\n?/g,'\n').replace(/\t/g,'    ').split('\n')){
  if(!paragraph){lines.push('');continue;}
  const chars=segmenter?Array.from(segmenter.segment(paragraph),s=>s.segment):Array.from(paragraph);
  let line='';
  for(const ch of chars){if(line&&ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch;}else line+=ch;}
  lines.push(line);
 }
 return lines;
}

 app.innerHTML=`<section class="page"><div class="page-heading"><div><button class="back" data-nav="home">${icon('left')}ホームへ</button><h1>設定・データ管理</h1></div><span class="pill">NAGI v${VERSION}</span></div><div class="settings-grid"><div class="card settings-card"><div class="question-icon">${icon('lock')}</div><h2>あなたの記録は、端末の中に。</h2><p>このアプリは、気分・睡眠・服薬・メモをブラウザ内に保存します。記録をサーバーへ自動送信する機能、アクセス解析、ログイン、広告はありません。</p><p style="margin-top:10px"><strong>別の端末・別のブラウザ・別のURLには自動で引き継がれません。</strong>履歴やサイトデータの削除、プライベートモードでは記録が失われる場合があります。</p><details><summary>保存とプライバシーの注意</summary><p>記録は暗号化されていません。この端末・ブラウザを使える人は記録を見ることができます。共有端末での利用は避け、端末のロックをお使いください。公開URLに置くのは空のアプリ本体であり、あなたの記録は含みません。ホスティング先にはページへのアクセス情報が残る場合があります。\nHTMLを直接開いた場合、保存の挙動はブラウザにより異なります。大切な記録にはバックアップをご利用ください。</p></details></div><div class="card settings-card"><div class="question-icon">${icon('download')}</div><h2>バックアップ</h2><p>一覧の記録：<strong>${recordGroups().length}件</strong>（追記メモを含む保存データは${entries.length}件）。ファイルを保存しておくと、別の端末でも読み込めます。データの読み込みは既存の記録に追加・統合されます。</p><div class="settings-buttons"><button class="primary" data-action="export">${icon('download')}バックアップを保存（JSON）</button><button class="secondary" data-action="import">${icon('upload')}バックアップを読み込む</button><button class="secondary" data-action="export-csv">${icon('download')}一覧を保存（CSV）</button>${corruptKeys.size?'<button class="secondary" data-action="export-raw">元データを退避</button>':''}</div><p style="margin-top:12px;font-size:10px">保存したファイルにも気分や服薬などの情報が含まれます。暗号化はされないので、保管・共有にはご注意ください。バックアップは下書きも含みます。CSVは確定した記録のみです。追記メモはチェックのメモ欄に時刻付きでまとめます。JSONでは元のメモを別々に保持します。</p></div><div class="card settings-card"><div class="question-icon">${icon('info')}</div><h2>NAGIについて</h2><p>自分の感覚を、残したいところだけ。毎日の回答数や連続日数で採点しない、個人用の記録アプリです。</p><p style="margin-top:10px"><strong>このアプリの点数は、医学的に検証された診断尺度ではありません。</strong>気分の1本の軸だけでは、同時に起こる異なる感覚は表せません。イライラ・不安・活動量などを別々に残せます。</p><p style="margin-top:10px">診断、悪化の予測、服薬量の指示、緊急時の自動通知は行いません。気になる変化があれば、記録を主治医と確認してください。薬の量や飲み方は、主治医・薬剤師の指示に従ってください。</p><details><summary>記録の考え方と参考情報</summary><p>米国国立精神衛生研究所（NIMH）は、気分の変化を知るための生活記録・気分日誌を紹介しています。NAGI独自の点数や質問の有効性が検証されたという意味ではありません。</p><a class="source-link" href="https://www.nimh.nih.gov/health/publications/bipolar-disorder" target="_blank" rel="noopener noreferrer">NIMH：Bipolar Disorder</a><p style="margin-top:8px">ブラウザ内の保存について：<a class="source-link" href="https://developer.mozilla.org/en-US/docs/Web/API/Window/localStorage" target="_blank" rel="noopener noreferrer">MDN：localStorage</a></p></details></div><div class="card settings-card"><div class="question-icon warm">${icon('home')}</div><h2>いつも使える場所に</h2><p>${HOSTED?'URLで開いたあと、スマートフォンのブラウザから「ホーム画面に追加」をすると、アプリのように開けます。対応ブラウザでは、一度開いたあとはオフラインでも動作します。':'これは単一HTMLの試作版です。パソコンではブラウザで開けます。スマートフォンでの利用・ホーム画面への追加は、URLで公開した版をご利用ください。'}</p><p style="margin-top:10px">入力途中でもホームに戻れます。回答を選んだチェックとメモだけを下書きとして残します。誤って開いただけのチェックは残りません。「決定」で次の質問へ進み、「保存して終了」で記録を確定します。「取り消す」はチェックの下書きだけを消し、保存済みの記録は消しません。</p><div class="button-line"><button class="secondary" data-nav="home">ホームへ</button></div><details><summary>データを削除</summary><p>この操作は取り消せません。先にバックアップを保存してください。</p><button class="text-button danger-text" data-action="delete-all">${icon('trash')}すべての記録・下書きを削除</button></details></div></div><p class="notice-footer">作成：2026年9月 · 個人用プロトタイプ · 数値による「安定度スコア」は表示しません。</p></section>`;
}
async function edit(entryId){
 const e=entries.find(x=>x.id===entryId);if(!e)return;
 if(e.mode==='memo'){if(memoDraft?.text?.trim()&&memoDraft.id!==e.id){if(!await ask('メモの下書きがあります','今の下書きを破棄して、この記録を編集しますか？','破棄して編集',true))return;}memoDraft={id:e.id,text:e.note,date:e.date,timestamp:e.timestamp};persistMemo();nav('memo');}
 else{if(draft&&count(draft)&&draft.id!==e.id){if(!await ask('途中の回答があります','今の途中の回答を破棄して、この記録を編集しますか？','破棄して編集',true))return;}draft={id:e.id,mode:e.mode,date:e.date,timestamp:e.timestamp,answers:{...e.answers},note:e.note,index:0,orderVersion:ORDER_VERSION};persistDraft();nav('check');}
}

async function deleteEntry(entryId){
 const e=entries.find(x=>x.id===entryId);if(!e)return;
 const owner=groupedEntry(e.id),children=e.mode!=='memo'?(owner?.quickMemos||[]):[];
 const isAttached=e.mode==='memo'&&owner?.id!==e.id;
 const title=isAttached?'この追記メモを削除しますか？':'この記録を削除しますか？';
 const text=recordTitle(e)+(isAttached?'\nこのクイックメモだけを削除します。チェック本体やほかのメモは残ります。':children.length?`\nチェック本体と、そのとき入力したメモを削除します。\nあとからのクイックメモ${children.length}件は消しません。同日の別のチェックの下に移るか、単独のメモとして残ります。`:'')+'\nこの操作は取り消せません。';
 if(!await ask(title,text,'削除する',true))return;
 const latest=loadEntries().filter(x=>x.id!==e.id);if(corruptKeys.has(KEYS.entries)){showWarning();return;}
 if(write(KEYS.entries,latest)){
  entries=latest;if(draft?.id===e.id){draft=null;removeKey(KEYS.draft);}if(memoDraft?.id===e.id){memoDraft=null;removeKey(KEYS.memo);}
  if(isAttached&&entries.some(x=>x.id===owner.id))nav('summary',owner.id);else nav('history');
  toast(isAttached?'追記メモを削除しました':'記録を削除しました');
 }
}

function download(text,filename,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function exportBackup(){const obj={app:'NAGI',schemaVersion:1,version:VERSION,exportedAt:timeISO(),entries,checkDraft:draft,memoDraft};download(JSON.stringify(obj,null,2),'NAGI_backup_'+localDay()+'_'+pad(new Date().getHours())+pad(new Date().getMinutes())+'.json','application/json');toast('バックアップファイルを作成しました');}
function exportCSV(){const keys=Object.keys(FIELDS).filter(x=>x!=='note');const cell=v=>{let s=String(v??'');if(/^(?:\s*[=+@-]|[\t\r])/.test(s)&&typeof v!=='number')s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};const rows=[['日付','時刻','種類',...keys.map(k=>FIELDS[k].label),'メモ'],...recordGroups().map(e=>[e.date,localTime(e.timestamp),MODES[e.mode].label,...keys.map(k=>k==='medication'&&e.answers[k]?MEDS[e.answers[k]]:(e.answers[k]??'')),combinedNote(e)])];download('\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'NAGI_records_'+localDay()+'.csv','text/csv;charset=utf-8');toast('一覧ファイルを作成しました');}
function validateDraft(d){
 if(!d)return null;
 if(!['morning','evening'].includes(d.mode)||!validDay(d.date)||typeof d.timestamp!=='string'||!Number.isFinite(Date.parse(d.timestamp)))throw Error('下書きの形式が正しくありません。');
 const temp=validateEntry({...d,note:d.note?.trim()?d.note:'__empty_draft__'});
 const order=ORDER[temp.mode];
 let index=Math.max(0,Number.isInteger(d.index)?d.index:0);
 // v1 stores only an index; retain the question it referred to, not its new position.
 if(temp.mode==='morning'&&d.orderVersion!==ORDER_VERSION){
  const key=LEGACY_MORNING_ORDER[Math.min(index,LEGACY_MORNING_ORDER.length-1)];
  index=order.indexOf(key);
 }
 const normalized={id:temp.id,mode:temp.mode,date:temp.date,timestamp:temp.timestamp,answers:temp.answers,note:typeof d.note==='string'?d.note:'',index:Math.max(0,Math.min(index,order.length-1)),orderVersion:ORDER_VERSION};return count(normalized)?normalized:null;
}
function validateMemo(m){if(!m)return null;if(typeof m.text!=='string'||m.text.length>6000||!validDay(m.date)||!Number.isFinite(Date.parse(m.timestamp))||(m.id&&!/^[\w-]{1,100}$/.test(m.id)))throw Error('メモの下書きが正しくありません。');return{text:m.text,date:m.date,timestamp:new Date(m.timestamp).toISOString(),...(m.id?{id:m.id}:{})};}
async function importFile(file){
 if(!file)return;if(file.size>12*1024*1024){toast('ファイルが大きすぎます（上限12MB）。',4000);return;}
 try{const obj=JSON.parse(await file.text());if(obj.app!=='NAGI'||obj.schemaVersion!==1||!Array.isArray(obj.entries)||obj.entries.length>10000)throw Error('NAGIのバックアップ（形式1）を選んでください。');const incoming=obj.entries.map(validateEntry),incDraft=validateDraft(obj.checkDraft),incMemo=validateMemo(obj.memoDraft);if(new Set(incoming.map(e=>e.id)).size!==incoming.length)throw Error('重複したIDがあるため読み込めません。');
 if(!await ask('バックアップを読み込みますか？',`${incoming.length}件の記録を追加・統合します。同じIDは更新日時が新しい方を残します。\n既存の下書きは保持します。空いているときだけバックアップの下書きを復元します。`,'読み込む'))return;
 if(corruptKeys.has(KEYS.entries))throw Error('元データに問題があります。退避してから読み込んでください。');const base=loadEntries(),map=new Map(base.map(e=>[e.id,e]));for(const e of incoming){const old=map.get(e.id);if(!old||old.updatedAt<e.updatedAt)map.set(e.id,e);}const merged=[...map.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.timestamp.localeCompare(b.timestamp));if(write(KEYS.entries,merged)){entries=merged;if(!draft&&incDraft){draft=incDraft;persistDraft();}if(!memoDraft?.text&&incMemo){memoDraft=incMemo;persistMemo();}renderSettings();toast('バックアップを読み込みました');}
 }catch(e){toast(e.message||'ファイルを読み込めませんでした。',5000);}finally{$('#import-input').value='';}
}
async function deleteAll(){if(!await ask('すべてのデータを削除しますか？','このブラウザにある全記録と下書きを削除します。\n保存済みのバックアップファイルは削除されません。\nこの操作は取り消せません。','すべて削除',true))return;const ok=Object.values(KEYS).map(removeKey).every(Boolean);if(ok){entries=[];draft=null;memoDraft=null;corruptKeys.clear();storageOK=true;renderSettings();showWarning();toast('このブラウザの記録を削除しました');}else toast('削除に失敗したデータがあります。',4000);}
function exportRaw(){const raw={app:'NAGI_RAW_RESCUE',at:timeISO(),data:{}};for(const [name,key]of Object.entries(KEYS)){try{raw.data[name]=localStorage.getItem(key);}catch(e){raw.data[name]='読み込み不可';}}download(JSON.stringify(raw,null,2),'NAGI_raw_rescue_'+localDay()+'.json','application/json');}
// All interactive controls use a single delegated handler; user text is never HTML.
document.addEventListener('click',async event=>{
 const t=event.target.closest('button');if(!t||t.disabled)return;
 if(t.dataset.nav){nav(t.dataset.nav);return;}
 if(t.dataset.start){await start(t.dataset.start);return;}
 if(t.dataset.summary){nav('summary',t.dataset.summary);return;}
 if(t.dataset.diary){openDiaryImage(t.dataset.diary);return;}
 if(t.hasAttribute('data-answer')){choose(t.dataset.answer);return;}
 if(t.dataset.edit){await edit(t.dataset.edit);return;}
 if(t.dataset.delete){await deleteEntry(t.dataset.delete);return;}
 if(t.dataset.historyTab){historyTab=t.dataset.historyTab;listLimit=25;renderHistory();return;}
 if(t.dataset.day){selectedDay=t.dataset.day;renderHistory();return;}
 if(t.dataset.month){calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+Number(t.dataset.month),1);renderHistory();return;}
 switch(t.dataset.action){
 case'close-diary':$('#diary-dialog').close();break;case'share-diary':await shareDiaryImage();break;
 case'confirm-answer':confirmAnswer();break;case'discard-check':await cancelCheck();break;
 case'save-check':saveCheck();break;case'save-memo':saveMemo();break;case'skip':skip();break;case'previous':previous();break;
 case'sleep-custom':{const input=$('#sleep-custom');if(!input.value.trim()){toast('時間を入力してください。');break;}const n=Number(input.value);if(!Number.isFinite(n)||n<0||n>24||!Number.isInteger(n*2)){toast('0〜24時間を、0.5時間（30分）単位で入力してください。',3500);break;}choose(n);break;}
 case'clear-day':selectedDay=null;renderHistory();break;case'more':listLimit+=25;renderHistory();break;
 case'export':exportBackup();break;case'export-csv':exportCSV();break;case'import':$('#import-input').click();break;case'delete-all':await deleteAll();break;case'export-raw':exportRaw();break;
 case'discard-memo':if(await ask('下書きを破棄しますか？','まだ保存していないメモを削除します。','破棄する',true)){memoDraft=null;removeKey(KEYS.memo);nav('home');}break;
 }
});
$('#diary-dialog').addEventListener('cancel',()=>{/* Native Escape closes only the preview. */});
$('#dialog-ok').addEventListener('click',()=>closeAsk(true));$('#dialog-cancel').addEventListener('click',()=>closeAsk(false));$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeAsk(false);});$('#import-input').addEventListener('change',e=>importFile(e.target.files[0]));
window.addEventListener('popstate',render);
window.addEventListener('storage',e=>{if(e.key===KEYS.entries){entries=loadEntries();if(['home','history','summary','settings'].includes(currentView))render();}});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){if(currentView==='memo')saveMemo();if(currentView==='check')saveCheck();}});
window.addEventListener('beforeunload',e=>{if(!storageOK&&(count(draft)||memoDraft?.text?.trim())){e.preventDefault();e.returnValue='';}});
// Availability is tested with a write, not merely by checking for the property.
try{localStorage.setItem('nagi.storage-test','1');localStorage.removeItem('nagi.storage-test');}catch(e){storageOK=false;}
entries=loadEntries();try{const savedDraft=read(KEYS.draft,null);draft=validateDraft(savedDraft);if(savedDraft&&!draft&&!corruptKeys.has(KEYS.draft))removeKey(KEYS.draft);}catch(e){corruptKeys.add(KEYS.draft);draft=null;}try{memoDraft=validateMemo(read(KEYS.memo,null));}catch(e){corruptKeys.add(KEYS.memo);memoDraft=null;}
$('#settings-icon').innerHTML=icon('settings');render();
if(HOSTED&&'serviceWorker'in navigator&&['https:','http:'].includes(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{/* Recording remains available without offline caching. */});});}
})();
